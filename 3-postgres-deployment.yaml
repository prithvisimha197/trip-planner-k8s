apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: trip-planner
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-planner
      component: database
  template:
    metadata:
      labels:
        app: trip-planner
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: tripplanner
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trip-planner-secrets
              key: postgres-password
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
