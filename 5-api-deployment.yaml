apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-planner-api
  labels:
    app: trip-planner
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-planner
      component: api
  template:
    metadata:
      labels:
        app: trip-planner
        component: api
    spec:
      containers:
      - name: api
        image: prithvisimha197/trip-planner-api:latest
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: trip-planner-secrets
              key: database-url
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: trip-planner-secrets
              key: jwt-secret-key
        - name: FLASK_ENV
          value: "development"
        - name: CORS_ORIGINS
          value: "http://localhost:3000,http://127.0.0.1:55106"
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
